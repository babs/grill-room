version: "2"
linters:
  enable:
    - bodyclose
    - gocritic
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert
  settings:
    revive:
      rules:
        - name: exported
    errcheck:
      exclude-functions:
        - (*database/sql.Rows).Close
        - (io.ReadCloser).Close
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck, gosec]
      # Goldmark extensions ported from grip-live-diff: kept as upstream wrote them, so they stay
      # diffable against it. gosec still applies.
      - path: internal/render/(alert|footnote|frontmatter|highlighting|mathjax|tasklist)/
        linters: [revive, gocritic]
