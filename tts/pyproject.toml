[project]
name = "grill-tts"
version = "0.1.0"
description = "Speaks grill-room personas' lines into the LiveKit call"
requires-python = ">=3.14"
dependencies = [
    "pocket-tts==3.3.0",
    # Direct, so the CPU index below applies: the PyPI build drags ~3 GB of CUDA wheels.
    "torch>=2.9",
    # LGPL-2.1, used unmodified (AC12).
    "num2words==0.5.14",
    "numpy>=2.3",
    "scipy>=1.15",
    "soundfile>=0.13",
    "livekit>=1.1",
    "livekit-api>=1.2",
    "aiohttp>=3.14",
    "httpx>=0.28",
    "pydantic-settings>=2.14",
    "python-dotenv>=1.2",
    "structlog>=26.1",
    "prometheus-client>=0.26",
    "opentelemetry-api>=1.44",
    "opentelemetry-sdk>=1.44",
    "opentelemetry-distro>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-exporter-otlp>=1.44",
]

[dependency-groups]
dev = [
    "pytest>=9", "pytest-asyncio>=1.4", "pytest-cov>=7",
    "mypy>=2", "ruff>=0.16",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.mypy]
strict = true
disallow_untyped_defs = true
disallow_any_generics = true
strict_optional = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["pocket_tts.*", "num2words.*", "soundfile.*", "torch.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-v --tb=short --strict-markers"
markers = ["e2e: needs the Pocket TTS weights"]
