[project]
name = "grill-stt"
version = "0.1.0"
description = "Transcribes grill-room LiveKit audio into room messages"
requires-python = ">=3.14"
dependencies = [
    "faster-whisper>=1.2,<1.3",
    # ctypes binding only: the image builds libtranscribe itself, pinned and AVX2 (spec 007, AC11).
    "transcribe-cpp==0.4.0",
    # av 19 rejects the metadata_errors kwarg faster-whisper 1.2.1 passes (spike S1-bis).
    "av>=16,<17",
    "livekit>=1.1",
    "livekit-api>=1.2",
    "aiohttp>=3.14",
    "httpx>=0.28",
    "pydantic-settings>=2.14",
    "python-dotenv>=1.2",
    "structlog>=26.1",
    "prometheus-client>=0.26",
    "opentelemetry-api>=1.44",
    "opentelemetry-sdk>=1.44",
    "opentelemetry-distro>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-exporter-otlp>=1.44",
]

[dependency-groups]
dev = [
    "pytest>=9", "pytest-asyncio>=1.4", "pytest-cov>=7",
    "mypy>=2", "ruff>=0.16",
]

[tool.uv]
# The prebuilt provider wheel is tuned for no CPU in particular and ships Vulkan: the image loads its
# own build through TRANSCRIBE_LIBRARY instead. A false marker drops the dependency.
override-dependencies = ["transcribe-cpp-native; python_version < '0'"]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.mypy]
strict = true
disallow_untyped_defs = true
disallow_any_generics = true
strict_optional = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "ctranslate2.*", "onnxruntime.*", "av.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-v --tb=short --strict-markers"
markers = ["e2e: needs the model download and real audio"]
