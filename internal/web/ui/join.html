<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join the room · grill-room</title>
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="icon" href="/static/icons/icon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#159F8C">
<link rel="stylesheet" href="/static/kit/tokens.css">
<script src="/static/kit/ui.js" defer></script>
<script src="/static/reauth.js" defer></script>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/join.js" defer></script>
</head>
<body class="join">
<header class="app-header">
  <img src="/static/logo.svg" alt="" class="logo" width="32" height="32">
  <span class="brand">grill-room</span>
</header>
<main class="card join-card">
  <h1>Join the room</h1>
  <form id="join" novalidate hidden>
    <label for="name">Your name, as the others will see it</label>
    <input id="name" maxlength="40" autocomplete="name" required autofocus aria-describedby="name-error">
    <p id="name-error" class="field-error" role="alert"></p>
    <button type="submit">Join the room</button>
  </form>
  <form id="create" novalidate hidden>
    <label for="room-name">Room name</label>
    <input id="room-name" maxlength="100" required aria-describedby="room-name-error">
    <p id="room-name-error" class="field-error" role="alert"></p>
    <label for="display-name">Display name, as the others will see it</label>
    <input id="display-name" maxlength="40" autocomplete="name" required aria-describedby="display-name-error">
    <p id="display-name-error" class="field-error" role="alert"></p>
    <button type="submit">Create a room</button>
    <p id="create-error" class="field-error" role="alert"></p>
  </form>
  <p id="status" role="status"></p>
  <p id="your-profile" hidden><a href="/profile">Your profile <strong id="your-profile-name"></strong></a></p>
  <section id="recover" hidden>
    <button type="button" id="recover-open" class="btn-ghost" aria-controls="recover-form" aria-expanded="false">Recover my profile by email</button>
    <form id="recover-form" hidden>
      <label for="recover-email">The email on your profile</label>
      <input id="recover-email" type="email" maxlength="254" autocomplete="email" required>
      <button type="submit" class="btn-secondary">Email me a sign-in link</button>
    </form>
  </section>
</main>
</body>
</html>
