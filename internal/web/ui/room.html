<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>grill-room</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/vendor/livekit-client.umd.js" defer></script>
<script src="/static/bridge.js" defer></script>
<script src="/static/room.js" defer></script>
</head>
<body class="room">
<header>
  <img src="/static/logo.svg" alt="" class="logo" width="32" height="32">
  <h1 id="room-name">grill-room</h1>
  <div id="voice" hidden>
    <span id="stt-status" role="status"></span>
    <button type="button" id="voice-join">Join audio</button>
    <button type="button" id="voice-unlock" hidden>Play audio</button>
    <button type="button" id="voice-mute" aria-pressed="false" hidden>Mute</button>
    <button type="button" id="voice-leave" hidden>Leave audio</button>
  </div>
  <span id="me"></span>
</header>
<p id="voice-error" role="alert" hidden></p>
<div id="voice-audio" hidden></div>
<p id="banner" role="alert" hidden></p>
<section id="pairing" aria-labelledby="pairing-title" hidden>
  <h2 id="pairing-title">Pair an agent daemon</h2>
  <p id="pairing-text"></p>
  <div class="pairing-actions" id="pairing-actions">
    <button type="button" id="pairing-deny">Deny</button>
    <button type="button" id="pairing-approve">Approve</button>
  </div>
</section>
<div class="layout">
  <aside>
    <h2>Participants</h2>
    <ul id="participants"></ul>
    <h2>Documents</h2>
    <ul id="documents"></ul>
    <label class="upload">Upload a document
      <input type="file" id="upload-input" accept=".md,.markdown,.html,.htm,.pdf,.png,.jpg,.jpeg,.gif,.webp,.svg,.docx,.odt,.pptx">
    </label>
    <p id="upload-status" role="status"></p>
  </aside>
  <section id="viewer" hidden>
    <div class="viewer-head">
      <h2 id="doc-name"></h2>
      <span id="doc-meta"></span>
      <a id="doc-original" hidden>Download original</a>
      <button type="button" id="doc-close" aria-label="Close document">Close</button>
    </div>
    <form id="revisions" hidden>
      <label>Revision <select id="rev"></select></label>
      <label>Compare with <select id="rev-from"></select></label>
    </form>
    <div class="viewer-body">
      <div id="doc-frame"></div>
      <aside id="annotations" aria-label="Annotations">
        <div class="annot-tools">
          <button type="button" id="annot-doc">Comment on the document</button>
          <button type="button" id="annot-pick" aria-pressed="false" hidden>Annotate an element</button>
        </div>
        <p class="annot-hint">Select text in the document to annotate it.</p>
        <form id="annot-new" hidden>
          <p id="annot-target"></p>
          <textarea id="annot-body" rows="3" maxlength="4000" aria-label="Annotation" placeholder="What should change here?"></textarea>
          <label class="annot-file">Images <input type="file" id="annot-files" accept="image/png,image/jpeg,image/gif,image/webp" multiple></label>
          <div class="annot-actions">
            <button type="button" id="annot-cancel">Cancel</button>
            <button type="submit">Save</button>
          </div>
        </form>
        <p id="annot-status" role="status"></p>
        <ol id="annot-list"></ol>
      </aside>
    </div>
  </section>
  <section class="chat">
    <ol id="messages" aria-live="polite"></ol>
    <form id="send">
      <textarea id="body" rows="2" maxlength="4000" placeholder="Write a message. Enter sends, Shift+Enter adds a line." aria-label="Message"></textarea>
      <button type="submit">Send</button>
    </form>
  </section>
</div>
</body>
</html>
