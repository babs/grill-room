<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · grill-room</title>
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="icon" href="/static/icons/icon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#159F8C">
<link rel="stylesheet" href="/static/kit/tokens.css">
<script src="/static/kit/ui.js" defer></script>
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="join">
<header class="app-header">
  <img src="/static/logo.svg" alt="" class="logo" width="32" height="32">
  <span class="brand">grill-room</span>
</header>
<main class="card join-card">
  <h1>{{.Title}}</h1>
  <p>{{.Text}}</p>
  {{if .Offer}}<ul>{{range .Moves}}<li>{{.}}</li>{{end}}</ul>
  <p>Your guest profile's other devices are signed out and its paired AI hosts removed.</p>
  <form method="post" action="/auth/attach">
    <input type="hidden" name="offer" value="{{.Offer}}">
    <p><button type="submit" name="choice" value="attach">Attach</button> <button type="submit" name="choice" value="later" class="btn-secondary">Not now</button></p>
  </form>
  {{else}}<p>{{if .Retry}}<a href="/auth/login">Sign in again</a> · {{end}}<a href="/">Home</a></p>{{end}}
</main>
</body>
</html>
