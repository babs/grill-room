name: release

# Strict semver only: the supervisor trusts release.yml@refs/tags/vX.Y.Z and nothing else (003-AC2).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}/sandbox
  COSIGN_RELEASE: v3.0.6
  ISSUER: https://token.actions.githubusercontent.com
  IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}

jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Security: no cache a branch run could have written into a signed release.
          cache: false
      - run: make release VERSION="$GITHUB_REF_NAME" DIST=dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned
          path: dist/
          if-no-files-found: error

  # Signs apart from the build: the OIDC token never sits in a job that runs the module graph.
  sign:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      id-token: write # keyless signing: the workflow identity Fulcio certifies
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned
          path: dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_RELEASE }}
      - run: |
          for f in dist/grill-room-daemon-*; do
            case "$f" in *.sha256) continue ;; esac
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$f"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daemon
          path: dist/
          if-no-files-found: error

  image:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            os: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: ts
        run: echo "ts=$(date -Iseconds)" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # The Dockerfile reads nothing from its context (the daemon builds it with none).
          context: internal/sandbox
          file: internal/sandbox/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT_HASH=${{ github.sha }}
            BUILD_TIMESTAMP=${{ steps.ts.outputs.ts }}
            PROJECT_URL=${{ github.server_url }}/${{ github.repository }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=sandbox-${{ matrix.arch }}
          cache-to: type=gha,scope=sandbox-${{ matrix.arch }},mode=max
      - env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: mkdir digests && touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: digests/
          if-no-files-found: error

  image-merge:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      packages: write # push the index and its signatures
      id-token: write # keyless signing
    outputs:
      ref: ${{ steps.merge.outputs.ref }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_RELEASE }}
      - id: merge
        working-directory: digests
        run: |
          sources=()
          for d in *; do sources+=("$IMAGE@sha256:$d"); done
          docker buildx imagetools create -t "$IMAGE:$GITHUB_REF_NAME" "${sources[@]}"
          digest=$(docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME" --format '{{json .Manifest}}' | jq -r .digest)
          # --recursive: the index a tag pull resolves to, and each platform image under it.
          cosign sign --yes --recursive "$IMAGE@$digest"
          cosign verify --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$IMAGE:$GITHUB_REF_NAME" >/dev/null
          echo "ref=$IMAGE:$GITHUB_REF_NAME@$digest" >> "$GITHUB_OUTPUT"

  release:
    needs: [sign, image-merge]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: daemon
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ needs.image-merge.outputs.ref }}
        run: |
          echo "$REF" > dist/sandbox-image.txt
          notes="Sandbox image: \`$REF\`

          Verify a binary (docs/release.md):

          \`\`\`
          cosign verify-blob --bundle <binary>.sigstore.json \\
            --certificate-identity $IDENTITY \\
            --certificate-oidc-issuer $ISSUER <binary>
          \`\`\`"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes "$notes" dist/*
