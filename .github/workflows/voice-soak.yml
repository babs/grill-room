# Temporary: repeats the real-model voice e2e on this branch to prove the flake fixes. Dropped before merge.
name: voice-soak

on:
  push:
    branches: [test/voice-e2e-flakes]

permissions:
  contents: read

jobs:
  soak:
    strategy:
      fail-fast: false
      matrix:
        suite: [persona-voice, persona-echo]
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_PASSWORD: grill-room-test
          POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      GRILL_ROOM_TEST_DATABASE_URL: postgres://postgres:grill-room-test@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: build
        run: echo "jobs=$(nproc)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: stt
          tags: grill-stt:local
          load: true
          build-args: |
            BUILD_JOBS=${{ steps.build.outputs.jobs }}
          cache-from: type=gha,scope=stt
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: tts/uv.lock
      - run: cd tts && uv sync --locked
      - if: matrix.suite == 'persona-echo'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: pocket-ungated-${{ hashFiles('tts/uv.lock') }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
          package_json_file: e2e/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - if: matrix.suite == 'persona-voice'
        run: make e2e-persona-voice PERSONA_VOICE_ARGS=--repeat-each=3
      - if: matrix.suite == 'persona-echo'
        run: make e2e-persona-echo
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.suite }}-${{ matrix.shard }}
          path: e2e/test-results/persona-voice/
          retention-days: 7
