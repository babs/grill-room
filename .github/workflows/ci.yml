name: ci

on:
  pull_request:
    branches: [develop]
  push:
    # feat/**: a feature branch is green before its PR opens.
    branches: [develop, "feat/**"]
  # The full flake gate: every Go package and every e2e spec, repeated, on demand.
  workflow_dispatch:
    inputs:
      full:
        description: Run the flake gate on every test, not only the changed ones
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # A full gate run must not cancel, or be cancelled by, the push or PR run on the same ref.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    # A throwaway PostgreSQL 16 in C locale (017-AC6) for the Go tests and the e2e servers.
    services: &pg
      postgres:
        image: postgres:16.15-alpine
        env: &pg-service-env
          POSTGRES_PASSWORD: grill-room-test
          POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env: &pg-env
      GRILL_ROOM_TEST_DATABASE_URL: postgres://postgres:grill-room-test@127.0.0.1:5432/postgres?sslmode=disable
      # The PG tests fail instead of skipping when the URL is missing.
      GRILL_ROOM_TEST_REQUIRE_PG: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No durability on a throwaway database: keeps make test fast (017-AC26). All three reload live.
      - &pg-tune
        env:
          PG: ${{ job.services.postgres.id }}
        run: >-
          docker exec "$PG" psql -q -U postgres -c "ALTER SYSTEM SET fsync = off"
          -c "ALTER SYSTEM SET synchronous_commit = off" -c "ALTER SYSTEM SET full_page_writes = off"
          -c "SELECT pg_reload_conf()"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-only: true
      # make lint runs tsc on the admin page (tools/ui).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
          package_json_file: tools/ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: tools/ui/pnpm-lock.yaml
      - run: make lint
      - run: make test
      - run: make build
      # 003-AC30: cross-compiles the six daemon targets a release ships.
      - run: make release VERSION=v0.0.0

  # The Go tests on the lab's PostgreSQL major. A job of its own, not a matrix: the go check keeps
  # its name. The 18 image refuses a mount on .../data, so the tmpfs is its parent.
  go-pg18:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env: *pg-service-env
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env: *pg-env
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *pg-tune
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -race -timeout 20m ./...

  # 003-AC30: unit tests on Windows. Docker and the POSIX-shell tests skip themselves (docs/release.md
  # lists them).
  windows:
    runs-on: windows-latest
    steps:
      # Golden files and embedded assets compare bytes: keep LF.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...

  stt:
    runs-on: ubuntu-latest
    env:
      # The e2e test fails, not skips, under CI without the model: give it the image's pinned one.
      WHISPER_REVISION: 536b0662742c02347bc0e980a01041f333bce120
      APP_MODEL: ${{ github.workspace }}/.whisper-small
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: stt/uv.lock
      - id: model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .whisper-small
          key: whisper-small-${{ env.WHISPER_REVISION }}
      - if: steps.model.outputs.cache-hit != 'true'
        working-directory: stt
        run: >-
          uv run python -c "import os, sys; from faster_whisper import download_model;
          download_model('small', output_dir=os.environ['APP_MODEL'], revision=sys.argv[1])"
          "$WHISPER_REVISION"
      - run: make stt-test

  # 007: the worker image with transcribe.cpp built from source and both models baked in; its e2e
  # tests then run inside it with no network, for both engines.
  stt-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: build
        run: echo "jobs=$(nproc)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: stt
          tags: grill-stt:local
          load: true
          build-args: |
            BUILD_JOBS=${{ steps.build.outputs.jobs }}
          cache-from: type=gha,scope=stt
          cache-to: type=gha,scope=stt,mode=max
      # The test image builds FROM grill-stt:local, which only the Docker engine's own builder sees.
      - env:
          BUILDX_BUILDER: default
          STT_TEST_CPUS: "4"
        run: make stt-image-e2e

  # 013: the tts pod's text layer, audio chain and turn-taking, on the fake engine.
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: tts/uv.lock
      - run: make tts-test

  scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: scenarios/uv.lock
      - run: make scenarios-test

  # The flake gate (test hygiene): the tests a change adds or edits run again and again, on both
  # OSes, against the PR's base or develop. A test that passes once by luck fails here. Two jobs:
  # service containers only run on Linux, and Windows skips the PG tests (docs/release.md).
  flake-go:
    name: flake-go (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.full && 180 || 90 }}
    services: *pg
    env: *pg-env
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - *pg-tune
      - env:
          BASE: ${{ inputs.full && 'all' || github.event.pull_request.base.sha || 'origin/develop' }}
          CGO_ENABLED: "1"
        run: tools/flake-gate.sh "$BASE" go

  flake-go-windows:
    name: flake-go (windows-latest)
    runs-on: windows-latest
    timeout-minutes: ${{ inputs.full && 180 || 90 }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The race detector needs cgo; the Windows image ships gcc.
      - shell: bash
        env:
          BASE: ${{ inputs.full && 'all' || github.event.pull_request.base.sha || 'origin/develop' }}
          CGO_ENABLED: "1"
        run: tools/flake-gate.sh "$BASE" go

  flake-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.full && 120 || 60 }}
    services: *pg
    env: *pg-env
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - *pg-tune
      # The device transcription model the device-stt specs self-test on (010-AC2), cached per pin set.
      - id: device-model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .device-stt-models
          key: device-stt-${{ hashFiles('internal/devicestt/manifest.go') }}
      - if: steps.device-model.outputs.cache-hit != 'true'
        env:
          GRILL_ROOM_E2E_MODEL_DIR: ${{ github.workspace }}/.device-stt-models
        run: go run ./cmd/grill-room models fetch --dir "$GRILL_ROOM_E2E_MODEL_DIR"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
          package_json_file: e2e/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      # The Azure apt mirror at times serves tens of kB/s: the .debs and Firefox are kept across runs,
      # per runner image and week so a stale set does not linger.
      - &sys-key
        id: sys-key
        run: echo "key=e2e-sys-$ImageOS-$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - &sys-cache
        id: sys-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/apt-archives
            ~/.cache/ms-playwright
          key: ${{ steps.sys-key.outputs.key }}-${{ hashFiles('e2e/pnpm-lock.yaml') }}
          restore-keys: ${{ steps.sys-key.outputs.key }}-
      - &apt-keep
        run: |
          mkdir -p ~/apt-archives/partial
          printf 'Dir::Cache::Archives "%s/apt-archives";\nAPT::Keep-Downloaded-Packages "true";\n' "$HOME" | sudo tee /etc/apt/apt.conf.d/99keep-archives
      - run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends pandoc
      # The firefox project's browser (e2e/playwright.config.js); Chrome is the runner's.
      - run: cd e2e && pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps firefox
      # apt wrote them as root: the cache saves as the runner user.
      - &apt-own
        run: sudo chown -R "$USER" ~/apt-archives
      # Saved now, not at the job's end: a run that times out in the tests still fills it.
      - &sys-save
        if: steps.sys-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/apt-archives
            ~/.cache/ms-playwright
          key: ${{ steps.sys-cache.outputs.cache-primary-key }}
      - env:
          BASE: ${{ inputs.full && 'all' || github.event.pull_request.base.sha || 'origin/develop' }}
          GRILL_ROOM_E2E_MODEL_DIR: ${{ github.workspace }}/.device-stt-models
        run: tools/flake-gate.sh "$BASE" e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flake-e2e-results
          path: e2e/test-results/
          retention-days: 7

  # 010: the voice handover between a participant's device and the STT worker, with LiveKit, the
  # worker image, the real device model and Chrome on one runner (make e2e-device-voice).
  device-voice:
    # After stt-image, so the worker image comes from a warm layer cache.
    needs: [stt-image]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services: *pg
    env: *pg-env
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: build
        run: echo "jobs=$(nproc)" >> "$GITHUB_OUTPUT"
      # The stt-image job's layer cache: a warm run only loads the image.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: stt
          tags: grill-stt:local
          load: true
          build-args: |
            BUILD_JOBS=${{ steps.build.outputs.jobs }}
          cache-from: type=gha,scope=stt
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - *pg-tune
      - id: device-model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .device-stt-models
          key: device-stt-${{ hashFiles('internal/devicestt/manifest.go') }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
          package_json_file: e2e/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      # The flake gate's rule for a changed spec: three runs in a row.
      - env:
          DEVICE_STT_MODEL_DIR: ${{ github.workspace }}/.device-stt-models
          # 4 vCPUs: two for the worker, the rest for Chrome's model, LiveKit and the server.
          DEVICE_VOICE_STT_CPUS: "2"
        run: make e2e-device-voice DEVICE_VOICE_ARGS=--repeat-each=3
      # The worker's log (test-results/device-voice/stt.log) and the Playwright results.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-voice-results
          path: e2e/test-results/
          retention-days: 7

  # 013: a persona speaks in the call through LiveKit, with the worker image and the tts pod on its
  # fake engine (make e2e-persona-voice). The real engine's image needs the gated weights: it is
  # built and run on the lab, never here.
  persona-voice:
    needs: [stt-image]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services: *pg
    env: *pg-env
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: build
        run: echo "jobs=$(nproc)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: stt
          tags: grill-stt:local
          load: true
          build-args: |
            BUILD_JOBS=${{ steps.build.outputs.jobs }}
          cache-from: type=gha,scope=stt
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - *pg-tune
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: tts/uv.lock
      - run: cd tts && uv sync --locked
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
          package_json_file: e2e/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      # The flake gate's rule for a changed spec: three runs in a row.
      - run: make e2e-persona-voice PERSONA_VOICE_ARGS=--repeat-each=3
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: persona-voice-results
          path: e2e/test-results/
          retention-days: 7

  # 013-AC35: Chrome in a container with its own PipeWire loop, a persona speaking on the real engine.
  persona-echo:
    needs: [stt-image]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services: *pg
    env: *pg-env
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: build
        run: echo "jobs=$(nproc)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: stt
          tags: grill-stt:local
          load: true
          build-args: |
            BUILD_JOBS=${{ steps.build.outputs.jobs }}
          cache-from: type=gha,scope=stt
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - *pg-tune
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: tts/uv.lock
      - run: cd tts && uv sync --locked
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: pocket-ungated-${{ hashFiles('tts/uv.lock') }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
          package_json_file: e2e/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - run: make e2e-persona-echo
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: persona-echo-results
          path: e2e/test-results/persona-voice/
          retention-days: 7

  # 013-AC33: every seed lexicon entry said by the real engine and heard back by the STT image, when
  # the lexicon or the speech path changed (all of it on a manual run).
  lexicon:
    needs: [stt-image]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: changed
        env:
          BASE: ${{ github.event_name == 'workflow_dispatch' && 'all' || github.event.pull_request.base.sha || github.event.before }}
        run: |
          paths="tts/grill_tts/lexicon_seed.json tts/grill_tts/textlayer.py tts/grill_tts/lexcheck.py tts/grill_tts/roundtrip.py tts/grill_tts/audio.py tts/grill_tts/engine.py tts/uv.lock stt/ Makefile .github/workflows/ci.yml"
          # shellcheck disable=SC2086 # paths is a word list
          if [ "$BASE" = all ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null || ! git diff --quiet "$BASE" HEAD -- $paths; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.run == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.changed.outputs.run == 'true'
        id: build
        run: echo "jobs=$(nproc)" >> "$GITHUB_OUTPUT"
      - if: steps.changed.outputs.run == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: stt
          tags: grill-stt:local
          load: true
          build-args: |
            BUILD_JOBS=${{ steps.build.outputs.jobs }}
          cache-from: type=gha,scope=stt
      - if: steps.changed.outputs.run == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: tts/uv.lock
      # Pocket's ungated weights and voice states, per engine pin.
      - if: steps.changed.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: pocket-ungated-${{ hashFiles('tts/uv.lock') }}
      - if: steps.changed.outputs.run == 'true'
        run: make tts-lexcheck LEXCHECK_THREADS=4
      - if: always() && steps.changed.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lexicon-report
          path: tts/.lexcheck/report.json
          retention-days: 30

  # Browser tests against fresh servers, agent turns with the fake claude in Docker, magic links
  # against a throwaway mailpit: no Claude request.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services: *pg
    env: *pg-env
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - *pg-tune
      # The device transcription model the device-stt specs self-test on (010-AC2), cached per pin set.
      - id: device-model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .device-stt-models
          key: device-stt-${{ hashFiles('internal/devicestt/manifest.go') }}
      - if: steps.device-model.outputs.cache-hit != 'true'
        env:
          GRILL_ROOM_E2E_MODEL_DIR: ${{ github.workspace }}/.device-stt-models
        run: go run ./cmd/grill-room models fetch --dir "$GRILL_ROOM_E2E_MODEL_DIR"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
          package_json_file: e2e/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - *sys-key
      - *sys-cache
      - *apt-keep
      # Office uploads convert through pandoc; the runner's Chrome is the one the specs drive.
      - run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends pandoc
      # The firefox project's browser (e2e/playwright.config.js).
      - run: cd e2e && pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps firefox
      - *apt-own
      - *sys-save
      - env:
          GRILL_ROOM_E2E_MODEL_DIR: ${{ github.workspace }}/.device-stt-models
        run: make e2e
      # Traces and screenshots of a failed run; the invite links in them died with its server.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: e2e/test-results/
          retention-days: 7

  # 017-AC10, 017-AC11: two servers on one database, a browser on each, a fake AI host app. The
  # flake gate repeats only the main config's specs: this job runs its own three times.
  e2e-twopod:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services: *pg
    env: *pg-env
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - *pg-tune
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
          package_json_file: e2e/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      # The flake gate's rule for a changed spec: three runs in a row.
      - run: make e2e-twopod TWOPOD_ARGS=--repeat-each=3
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-twopod-results
          path: e2e/test-results/
          retention-days: 7
