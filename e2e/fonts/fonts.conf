<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The e2e browsers see these fonts alone, on every machine: DejaVu 2.37 (LICENSE-DejaVu) and
     Noto Color Emoji 2.051 (LICENSE-NotoColorEmoji). A layout assertion measures the same text
     locally and in CI. playwright.config.js points FONTCONFIG_FILE here. -->
<fontconfig>
  <dir prefix="relative">.</dir>
  <alias binding="same"><family>system-ui</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>sans-serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>monospace</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
  <alias binding="same"><family>emoji</family><prefer><family>Noto Color Emoji</family></prefer></alias>
  <!-- The rendering too: without /etc/fonts, full hinting rounds each glyph's advance to a pixel. -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
  </match>
</fontconfig>
