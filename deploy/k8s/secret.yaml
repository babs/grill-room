# `make k8s-render` fills the values from .env; only the rendered copy, in the untracked output
# directory, holds them.
apiVersion: v1
kind: Secret
metadata:
  name: grill-room
  labels:
    app.kubernetes.io/part-of: grill-room
type: Opaque
stringData:
  admin-token: "${GRILL_ROOM_ADMIN_TOKEN}"
  stt-token: "${STT_TOKEN}"
  tts-token: "${TTS_TOKEN}"
  livekit-api-key: "${LIVEKIT_API_KEY}"
  livekit-api-secret: "${LIVEKIT_API_SECRET}"
  livekit-keys: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
  smtp-username: "${GRILL_ROOM_SMTP_USERNAME}"
  smtp-password: "${GRILL_ROOM_SMTP_PASSWORD}"
