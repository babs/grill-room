# LiveKit with no exposed UDP (spike S4): browsers relay through TURN/TLS on traefik's 443, which
# terminates TLS and forwards plain TURN to tls_port (turn.external_tls). Rendered by `make k8s-render`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  labels:
    app.kubernetes.io/name: livekit
    app.kubernetes.io/part-of: grill-room
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: livekit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: livekit
        app.kubernetes.io/part-of: grill-room
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: livekit
          image: livekit/livekit-server:v1.13.9@sha256:d0c04791bf63ca8dcea123571827d56ba9504bd57c8d5de60ee03b5408cc3154
          env:
            - name: POD_IP
              valueFrom:
                fieldRef: { fieldPath: status.podIP }
            - name: LIVEKIT_KEYS
              valueFrom:
                secretKeyRef: { name: grill-room, key: livekit-keys }
            # The TURN relay hands media to the SFU on this pod's own IP, which LiveKit denies as a
            # private peer by default: allow that one address, not the whole pod network.
            - name: LIVEKIT_CONFIG
              value: |
                port: 7880
                log_level: info
                rtc:
                  tcp_port: 7881
                  udp_port: 7882
                  use_external_ip: false
                turn:
                  enabled: true
                  domain: ${TURN_HOST}
                  tls_port: 5349
                  external_tls: true
                  allow_restricted_peer_cidrs: ["$(POD_IP)/32"]
          ports:
            - { name: http, containerPort: 7880 }
            - { name: turn, containerPort: 5349 }
            - { name: rtc-tcp, containerPort: 7881 }
            - { name: rtc-udp, containerPort: 7882, protocol: UDP }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: livekit
  labels:
    app.kubernetes.io/name: livekit
    app.kubernetes.io/part-of: grill-room
spec:
  selector:
    app.kubernetes.io/name: livekit
  ports:
    - { name: http, port: 7880, targetPort: http }
    - { name: turn, port: 5349, targetPort: turn }
---
# Signalling (WebSocket) and the /rtc/validate probe.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: livekit
  labels:
    app.kubernetes.io/name: livekit
    app.kubernetes.io/part-of: grill-room
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: ${LIVEKIT_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: livekit
                port: { name: http }
---
# TURN over TLS on 443. `tls: {}` terminates with the default TLS store's wildcard certificate.
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: livekit-turn
  labels:
    app.kubernetes.io/name: livekit
    app.kubernetes.io/part-of: grill-room
spec:
  entryPoints: [websecure]
  routes:
    - match: HostSNI(`${TURN_HOST}`)
      services:
        - name: livekit
          port: 5349
  tls: {}
