# Room server on PostgreSQL (spec 017): two replicas, rolled one at a time. Rendered by
# `make k8s-render`, which fills the placeholders from .env.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grill-room
  labels:
    app.kubernetes.io/name: grill-room
    app.kubernetes.io/part-of: grill-room
spec:
  replicas: 2
  # A new pod is ready before an old one stops, so the room always has a server.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grill-room
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grill-room
        app.kubernetes.io/part-of: grill-room
    spec:
      automountServiceAccountToken: false
      # preStop 5 s, then Serve drains POSTs for 2 s and waits for mail sends, each bounded by 30 s
      # (sendMailTimeout).
      terminationGracePeriodSeconds: 45
      # Preferred, not required: a one-node cluster still runs both pods.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: grill-room
      # Service links would inject GRILL_ROOM_* and LIVEKIT_* variables the binaries read as config.
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Pinned model files for on-device transcription (010-AC7), fetched into each pod's own volume:
      # about 440 MB downloaded at each pod start. Egress: room-push.
      # --best-effort: a failed download must not block the server; it then offers no device mode.
      initContainers:
        - name: models
          image: ${GRILL_ROOM_IMAGE}
          args: [models, fetch, --best-effort, --dir, /models]
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: "1", memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: models, mountPath: /models }
      containers:
        - name: grill-room
          image: ${GRILL_ROOM_IMAGE}
          env:
            - name: GRILL_ROOM_URL
              value: https://${ROOM_HOST}
            - name: GRILL_ROOM_LIVEKIT_URL
              value: wss://${LIVEKIT_HOST}
            - name: GRILL_ROOM_LIVEKIT_API_URL
              value: http://livekit:7880
            # No credentials in the URL: pgx reads PGUSER and PGPASSWORD for a URL that has none.
            - name: GRILL_ROOM_DATABASE_URL
              value: postgres://${K8S_PG_HOST}:${K8S_PG_PORT}/${K8S_PG_DATABASE}?sslmode=${K8S_PG_SSLMODE}
            - name: PGUSER
              valueFrom:
                secretKeyRef: { name: "${K8S_PG_SECRET}", key: username }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: "${K8S_PG_SECRET}", key: password }
            # Below the mount: the emptyDir's root belongs to root, and the server stages only in a
            # directory it owns.
            - name: GRILL_ROOM_STAGING_DIR
              value: /staging/grill-room
            - name: GRILL_ROOM_ADMIN_TOKEN
              valueFrom:
                secretKeyRef: { name: grill-room, key: admin-token }
            - name: GRILL_ROOM_LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef: { name: grill-room, key: livekit-api-key }
            - name: GRILL_ROOM_LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef: { name: grill-room, key: livekit-api-secret }
            - name: GRILL_ROOM_STT_TOKEN
              valueFrom:
                secretKeyRef: { name: grill-room, key: stt-token }
            # Personas speak in the call (spec 013): on in the lab.
            - name: GRILL_ROOM_TTS_TOKEN
              valueFrom:
                secretKeyRef: { name: grill-room, key: tts-token }
            - name: GRILL_ROOM_SANDBOX_IMAGE
              value: "${GRILL_ROOM_SANDBOX_IMAGE}"
            # The ingress controller's pod CIDR: its X-Forwarded-For names the client (005-AC20).
            - name: GRILL_ROOM_TRUSTED_PROXIES
              value: "${GRILL_ROOM_TRUSTED_PROXIES}"
            # Empty turns email sign-in off.
            - name: GRILL_ROOM_SMTP_ADDR
              value: "${GRILL_ROOM_SMTP_ADDR}"
            - name: GRILL_ROOM_SMTP_FROM
              value: "${GRILL_ROOM_SMTP_FROM}"
            - name: GRILL_ROOM_DEVICE_STT_MODEL_DIR
              value: /models
            # The pod's address, for the scrape (deploy/monitoring/room.yaml); the network policy
            # admits nobody else to the port.
            - name: GRILL_ROOM_METRICS_ADDR
              value: ":7681"
          # The ingress routes to the pod until its endpoint removal reaches it: keep serving meanwhile
          # (docs/rollout.md). Native handler: the distroless image has no sleep binary.
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          ports:
            - { name: http, containerPort: 7680 }
            - { name: metrics, containerPort: 7681 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          # Not /healthz: a full volume fails it, and a restart would not free the space.
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            # pandoc runs in this container: office conversions need the headroom.
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: staging, mountPath: /staging }
            - { name: tmp, mountPath: /tmp }
            - { name: models, mountPath: /models, readOnly: true }
      volumes:
        # Per pod, not a ReadWriteOnce claim: that would pin both pods to one node.
        - name: models
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        # Two archive slots, each an import unpacked up to GRILL_ROOM_MAX_IMPORT_MB (default 1 GiB),
        # plus margin: past sizeLimit the kubelet evicts the pod.
        - name: staging
          emptyDir:
            sizeLimit: 2560Mi
---
# A node drain or other voluntary eviction keeps one server up (017-AC21).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: grill-room
  labels:
    app.kubernetes.io/name: grill-room
    app.kubernetes.io/part-of: grill-room
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grill-room
---
# No session affinity (spec 017, Q8): any pod answers any request.
apiVersion: v1
kind: Service
metadata:
  name: grill-room
  labels:
    app.kubernetes.io/name: grill-room
    app.kubernetes.io/part-of: grill-room
spec:
  selector:
    app.kubernetes.io/name: grill-room
  ports:
    - { name: http, port: 7680, targetPort: http }
    - { name: metrics, port: 7681, targetPort: metrics }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grill-room
  labels:
    app.kubernetes.io/name: grill-room
    app.kubernetes.io/part-of: grill-room
  annotations:
    # No tls.secretName: traefik serves the wildcard certificate from its default TLS store.
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: ${ROOM_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grill-room
                port: { name: http }
