# STT worker, parakeet-ultra (spec 007). One pod joins every active room: its ceiling is about four
# continuous talkers across the instance. Sizing from spike S10d on the lab's 4-vCPU AVX2 nodes:
# two engine processes of 2 threads give 8.4x real time (p95 3.9 s with two talkers), each holds
# 1.2 GB. Past the ceiling the queue waits (grill_stt_queue_wait_seconds, alert at 10 s) and,
# full, drops with a line in the room. Rendered by `make k8s-render`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stt
  labels:
    app.kubernetes.io/name: stt
    app.kubernetes.io/part-of: grill-room
spec:
  replicas: 1
  # A rolling update cannot schedule: no node has 2 CPUs free for a second worker beside the old one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: stt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stt
        app.kubernetes.io/part-of: grill-room
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        # The image's `app` user: numeric, so the kubelet can check runAsNonRoot.
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stt
          image: ${GRILL_STT_IMAGE}
          env:
            - name: APP_ROOM_URL
              value: http://grill-room:7680
            - name: APP_LIVEKIT_URL
              value: ws://livekit:7880
            # APP_ENGINE=whisper is the rollback for one release (docs/lab-checklist.md).
            - name: APP_ENGINE
              value: parakeet
            - name: APP_ENGINE_PROCESSES
              value: "2"
            - name: APP_CPU_THREADS
              value: "2"
            - name: APP_ROOM_TOKEN
              valueFrom:
                secretKeyRef: { name: grill-room, key: stt-token }
            - name: APP_LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef: { name: grill-room, key: livekit-api-key }
            - name: APP_LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef: { name: grill-room, key: livekit-api-secret }
          ports:
            - { name: metrics, containerPort: 9100 }
          # Loading the models takes a while on a cold node.
          startupProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 20
          # A 4-CPU worker node never has 4 CPUs free to request: ask for 2, burst to 4. Memory:
          # two engines of 1.2 GB plus the worker; request = limit, never evicted for memory.
          resources:
            requests: { cpu: "2", memory: 3Gi }
            limits: { cpu: "4", memory: 3Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
