# Rendered by run.sh: __NAME__, __CPU__, __MEM__, __THREADS__, __EVERY__, __RUNS__, __STORAGE_CLASS__.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: s10-cache
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: __STORAGE_CLASS__
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: __NAME__
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 10800
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: bench
          image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
          command: [bash, /bench/job.sh]
          args: [__RUNS__]
          env:
            - { name: THREADS, value: "__THREADS__" }
            - { name: EVERY, value: "__EVERY__" }
            - { name: HOME, value: /tmp }
          resources:
            # The STT pod asks for 2 CPUs; a 4-CPU lab node with other tenants may not have 2 free.
            requests: { cpu: 1400m, memory: __MEM__ }
            limits: { cpu: "__CPU__", memory: __MEM__ }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: bench, mountPath: /bench }
            - { name: cache, mountPath: /cache }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: bench, configMap: { name: s10-bench } }
        - { name: cache, persistentVolumeClaim: { claimName: s10-cache } }
        - { name: tmp, emptyDir: {} }
