[project]
name = "s14b-french-code-switching"
version = "0.1.0"
description = "Spike S14b: French TTS with English terms, on CPU"
requires-python = ">=3.13,<3.14"
dependencies = [
    "piper-tts==1.8.0",
    "pocket-tts==3.3.0",
    "supertonic==1.3.1",
    "kokoro-onnx==0.6.1",
    "num2words==0.5.14",
    "numpy>=2.3",
    "soundfile>=0.13",
    # Direct, so the CPU index below applies: the PyPI build drags ~3 GB of CUDA wheels.
    "torch>=2.9",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
# The formatter wraps code; what is left over 120 is a literal sentence of the test set.
ignore = ["E501"]
