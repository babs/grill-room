# Rendered by run.sh: __NAME__, __REQ__, __MEM__, __ARGS__.
# RWX volume: the setup Job fills it once, bench Jobs on several nodes read it at the same time.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: s10d-data
spec:
  accessModes: [ReadWriteMany]
  storageClassName: csi-cephfs
  resources:
    requests:
      storage: 30Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: __NAME__
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 14400
  template:
    metadata:
      labels: { app: s10d-bench }
    spec:
      restartPolicy: Never
      # One bench per node: two would share the node's 4 CPUs and skew each other's timings.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: { matchLabels: { app: s10d-bench } }
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: bench
          image: ghcr.io/astral-sh/uv:python3.12-bookworm@sha256:85d4cb1afa769a7338e095b927bee941cf5ec92266c7424b3f6c0f2748567248
          command: [bash, /bench/job.sh]
          args: [__ARGS__]
          env:
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          resources:
            # The 4-CPU workers are 57-84% requested: ask for what fits, burst to the real limit.
            requests: { cpu: __REQ__, memory: __MEM__ }
            limits: { cpu: "4", memory: __MEM__ }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: bench, mountPath: /bench }
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: bench, configMap: { name: s10d-bench } }
        - { name: data, persistentVolumeClaim: { claimName: s10d-data } }
        - { name: tmp, emptyDir: {} }
